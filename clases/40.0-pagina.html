<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reloj Analógico</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle, #1f2937, #020617);
      font-family: Arial, sans-serif;
    }

    .clock {
      position: relative;
      width: min(80vw, 420px);
      height: min(80vw, 420px);
      border: 12px solid #e5e7eb;
      border-radius: 50%;
      background: radial-gradient(circle, #ffffff 0%, #f1f5f9 100%);
      box-shadow:
        0 0 30px rgba(255, 255, 255, 0.2),
        inset 0 0 20px rgba(0, 0, 0, 0.15);
    }

    .clock::before {
      content: "";
      position: absolute;
      width: 18px;
      height: 18px;
      background: #111827;
      border-radius: 50%;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
    }

    .number {
      position: absolute;
      width: 100%;
      height: 100%;
      text-align: center;
      font-size: clamp(1.2rem, 4vw, 2rem);
      font-weight: bold;
      color: #111827;
    }

    .number span {
      display: inline-block;
      padding-top: 18px;
    }

    .n1  { transform: rotate(30deg); }
    .n1 span  { transform: rotate(-30deg); }

    .n2  { transform: rotate(60deg); }
    .n2 span  { transform: rotate(-60deg); }

    .n3  { transform: rotate(90deg); }
    .n3 span  { transform: rotate(-90deg); }

    .n4  { transform: rotate(120deg); }
    .n4 span  { transform: rotate(-120deg); }

    .n5  { transform: rotate(150deg); }
    .n5 span  { transform: rotate(-150deg); }

    .n6  { transform: rotate(180deg); }
    .n6 span  { transform: rotate(-180deg); }

    .n7  { transform: rotate(210deg); }
    .n7 span  { transform: rotate(-210deg); }

    .n8  { transform: rotate(240deg); }
    .n8 span  { transform: rotate(-240deg); }

    .n9  { transform: rotate(270deg); }
    .n9 span  { transform: rotate(-270deg); }

    .n10 { transform: rotate(300deg); }
    .n10 span { transform: rotate(-300deg); }

    .n11 { transform: rotate(330deg); }
    .n11 span { transform: rotate(-330deg); }

    .n12 { transform: rotate(0deg); }

    .hand {
      position: absolute;
      bottom: 50%;
      left: 50%;
      transform-origin: bottom center;
      transform: translateX(-50%) rotate(0deg);
      border-radius: 999px;
      z-index: 5;
    }

    .hour {
      width: 9px;
      height: 27%;
      background: #111827;
    }

    .minute {
      width: 6px;
      height: 36%;
      background: #374151;
    }

    .second {
      width: 3px;
      height: 42%;
      background: #dc2626;
      z-index: 6;
    }

    .tick {
      position: absolute;
      width: 100%;
      height: 100%;
      text-align: center;
    }

    .tick::before {
      content: "";
      display: inline-block;
      width: 3px;
      height: 12px;
      background: #64748b;
      border-radius: 2px;
      margin-top: 6px;
    }

    .tick.big::before {
      width: 5px;
      height: 18px;
      background: #111827;
    }
  </style>
</head>
<body>
  <div class="clock">
    <div class="number n1"><span>1</span></div>
    <div class="number n2"><span>2</span></div>
    <div class="number n3"><span>3</span></div>
    <div class="number n4"><span>4</span></div>
    <div class="number n5"><span>5</span></div>
    <div class="number n6"><span>6</span></div>
    <div class="number n7"><span>7</span></div>
    <div class="number n8"><span>8</span></div>
    <div class="number n9"><span>9</span></div>
    <div class="number n10"><span>10</span></div>
    <div class="number n11"><span>11</span></div>
    <div class="number n12"><span>12</span></div>

    <div class="hand hour" id="hour"></div>
    <div class="hand minute" id="minute"></div>
    <div class="hand second" id="second"></div>
  </div>

  <script>
    const clock = document.querySelector(".clock");

    for (let i = 0; i < 60; i++) {
      const tick = document.createElement("div");
      tick.className = "tick" + (i % 5 === 0 ? " big" : "");
      tick.style.transform = `rotate(${i * 6}deg)`;
      clock.appendChild(tick);
    }

    const hourHand = document.getElementById("hour");
    const minuteHand = document.getElementById("minute");
    const secondHand = document.getElementById("second");

    function updateClock() {
      const now = new Date();

      const milliseconds = now.getMilliseconds();
      const seconds = now.getSeconds() + milliseconds / 1000;
      const minutes = now.getMinutes() + seconds / 60;
      const hours = (now.getHours() % 12) + minutes / 60;

      const secondDeg = seconds * 6;
      const minuteDeg = minutes * 6;
      const hourDeg = hours * 30;

      secondHand.style.transform = `translateX(-50%) rotate(${secondDeg}deg)`;
      minuteHand.style.transform = `translateX(-50%) rotate(${minuteDeg}deg)`;
      hourHand.style.transform = `translateX(-50%) rotate(${hourDeg}deg)`;

      requestAnimationFrame(updateClock);
    }

    updateClock();
  </script>
</body>
</html>
