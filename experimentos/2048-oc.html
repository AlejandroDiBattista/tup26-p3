<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2048 Game</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #faf8ef;
            font-family: Arial, sans-serif;
        }
        .game-container {
            width: 300px;
            height: 300px;
            background-color: #bbada0;
            border-radius: 10px;
            position: relative;
            overflow: hidden;
        }
        .tile {
            font-size: 1.5em;
            line-height: 100px;
            text-align: center;
            border-radius: 5px;
            position: absolute;
        }
    </style>
</head>
<body>
    <div class="game-container" id="game-container"></div>
    <script>
        const container = document.getElementById('game-container');
        const size = 4;
        let board = Array.from({ length: size }, () => Array(size).fill(0));

        function draw() {
            container.innerHTML = '';
            board.forEach((row, i) => {
                row.forEach((value, j) => {
                    if (value > 0) {
                        const tile = document.createElement('div');
                        tile.classList.add('tile');
                        tile.style.backgroundColor = getColor(value);
                        tile.style.width = "70px";
                        tile.style.height = "70px";
                        tile.style.left = j * 75 + 'px';
                        tile.style.top = i * 75 + 'px';
                        tile.innerText = value;
                        container.appendChild(tile);
                    }
                });
            });
        }

        function getColor(value) {
            const colors = {
                2: '#eee4da',
                4: '#ede0c8',
                8: '#f2b179',
                16: '#f59563',
                32: '#f67c5f',
                64: '#f67c5f',
                128: '#f9f5ee',
                256: '#edcf72',
                512: '#edcc61',
                1024: '#edc850',
                2048: '#edc53f'
            };
            return colors[value] || '#bbada0';
        }

        function randomTile() {
            let emptyTiles = [];
            board.forEach((row, i) => {
                row.forEach((value, j) => {
                    if (value === 0) emptyTiles.push([i, j]);
                });
            });
            if (emptyTiles.length > 0) {
                const [i, j] = emptyTiles[Math.floor(Math.random() * emptyTiles.length)];
                board[i][j] = Math.random() > 0.5 ? 2 : 4;
                draw();
            }
        }

        function move(direction) {
            // Aquí deberías implementar la lógica de movimiento
            // Para simplificarlo, solo llamaremos randomTile
            randomTile();
        }

        window.addEventListener('keydown', function(event) {
            switch(event.key) {
                case 'ArrowUp':
                    move('up');
                    break;
                case 'ArrowDown':
                    move('down');
                    break;
                case 'ArrowLeft':
                    move('left');
                    break;
                case 'ArrowRight':
                    move('right');
                    break;
            }
        });

        randomTile();
        randomTile();
    </script>
</body>
</html>
